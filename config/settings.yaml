# memory-rag-mcp 的运行配置。
# 所有相对路径都以 AI-memory/memory-rag-mcp/ 为基准解析。
# 这份文件由服务进程在启动时读取一次。
# 当前运行中的 memory-rag-mcp 不会自动监听或热更新这里的配置。
# 修改任意配置后，都需要重启 MCP 进程，新的配置才会生效。

# MCP 服务自身的识别信息。
server:
  name: memory-rag-mcp # MCP 服务名，供服务端和客户端识别。

# 项目运行时使用的目录和文件路径。
paths:
  ai_memory_dir: .. # 代码所在的根目录
  data_dir: ../memory-rag-mcp-data # 本项目的数据目录。
  timeline_path: ../memory-rag-mcp-data/RAG记忆库时间线.md # 时间线 Markdown 文件路径。
  embeddings_path: ../memory-rag-mcp-data/memory_embeddings.npy # 本地 embedding 缓存矩阵文件路径。
  index_path: ../memory-rag-mcp-data/memory.faiss # FAISS 向量索引文件路径。
  meta_path: ../memory-rag-mcp-data/meta_NpyRow-to-id.json # 向量索引元数据文件路径。

# 主数据存储后端配置。
storage:
  backend: sqlite # 当前主数据存储后端；默认使用 SQLite。
  sqlite_path: ../memory-rag-mcp-data/memory.db # SQLite 主数据文件路径。

# embedding 模型与推理设备配置。
embedding:
  model_path: ../models/bge-m3 # 本地 embedding 模型目录。
  device: cpu # embedding 推理设备，例如 cpu 或 cuda。

# 记忆类型相关配置。
memory:
  kind_values: # 允许的记忆类型枚举值。
    - project_record
    - chat_event
    - fact
    - project_registry
    - field_record

# 摘要与标签生成相关配置。
summary:
  tag_fallback_limit: 6 # 服务端兜底标签的最大数量。
  short_summary_max_length: 120 # 自动生成简短摘要时的最大字符数。

# 搜索接口的基础限制。
search:
  max_top_k: 20 # 搜索接口允许返回的最大条数。
  min_similarity: null # 实体级最低相似度阈值；null 表示关闭过滤。
  message_score_gap: 0.2 # 同一聊天记录内，相对最高分消息的最大分差，包含边界。

# 检索文本拼接规则。
retrieval:
  chat_event_chunk_max_tokens: 1024 # 对话消息切片的配置上限；实际生效值为 min{当前 embedding 模型上限，该配置项}。最好不要太高，会稀释
  chat_event_chunk_overlap_tokens: 128 # 相邻消息切片的重叠 token 数；必须小于最终有效切片长度。
  field_candidates: # 默认参与检索文本拼接的字段顺序。
    - title
    - short_summary
    - problem_background
    - analysis
    - action_steps
    - validation_result
    - tags
    - reference_doc_path
  field_labels: # 检索文本拼接时使用的人类可读标签名。
    title: 标题
    short_summary: 简短摘要
    overview_summary: 项目概述
    problem_background: 问题背景
    analysis: 分析
    action_steps: 步骤
    validation_result: 验证结果
    detailed_summary: 详细总结
    tags: 标签
    reference_doc_path: 参考文档

# 对外结果字段裁剪规则。
results:
  returnMessageNum: 10 # 命中消息前后各扩展的消息条数，不是一问一答的轮数。
  max_total_messages: 40 # 默认详情每条聊天记录的真实消息上限；省略项不占额度。
  search_fields: # search 默认返回的轻量字段。
    - id
    - memory_kind
    - updated_at
    - created_at
    - title
    - short_summary
    - overview_summary
    - project_id
    - tags
    - reference_doc_path
